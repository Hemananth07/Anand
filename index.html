<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEC Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#8B0000,#C62828);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

.logo{
    width:110px;
    margin-bottom:15px;
}

h2{
    color:#8B0000;
    margin-bottom:5px;
}

h4{
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

.input-box{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-box:focus{
    border:2px solid #8B0000;
    outline:none;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#8B0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.login-btn:hover{
    background:#A30000;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:14px;
}

.links a{
    text-decoration:none;
    color:#8B0000;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

.create-account{
    margin-top:25px;
    font-size:15px;
}

.create-account a{
    color:#8B0000;
    font-weight:bold;
    text-decoration:none;
}

.create-account a:hover{
    text-decoration:underline;
}

.footer{
    margin-top:20px;
    color:#777;
    font-size:13px;
}
</style>

</head>
<body>

<div class="container">

    <!-- Replace logo.png with your logo filename -->
    <img src="logo.png" class="logo" alt="College Logo">

    <h2>Student Login</h2>
    <h4>Adhiparasakthi Engineering College</h4>

    <form>
        <input type="text" class="input-box" placeholder="Username" required>

        <input type="password" class="input-box" placeholder="Password" required>

        <button class="login-btn">Login</button>
    </form>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <a href="admin-login.html">Admin Login</a>
    </div>

    <div class="create-account">
        New User?
        <a href="register.html">Create Account</a>
    </div>

    <div class="footer">
        Study | Spirituality | Service
    </div>

</div>

</body>
</html>
