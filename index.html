<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#8B0000,#C62828);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

h2{
    color:#8B0000;
    margin-bottom:5px;
}

h4{
    color:#555;
    margin-bottom:25px;
    font-size:14px;
}

.input-box{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-box:focus{
    border-color:#8B0000;
    outline:none;
}

.login-btn{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#8B0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background:#A30000;
}

.footer{
    margin-top:20px;
    font-size:13px;
    color:#666;
}
</style>

</head>
<body>

<div class="login-container">

    <!-- Change logo.png if your image has a different name -->
    <img src="logo.png" alt="College Logo" class="logo">

    <h2>Student Login</h2>
    <h4>Adhiparasakthi Engineering College</h4>

    <form>
        <input type="text" class="input-box" placeholder="Username" required>

        <input type="password" class="input-box" placeholder="Password" required>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="footer">
        Study | Spirituality | Service
    </div>

</div>

</body>
</html>
